[project]
name = "llm-gateway"
version = "0.1.0"
description = "Generic LLM completion abstraction gateway library"
dependencies = [
    "openai>=1.20.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
