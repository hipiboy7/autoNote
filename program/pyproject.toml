[project]
name = "llm-automation"
version = "0.1.0"
description = "Investment Research Automation Hybrid Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[tool.uv]
workspace = { members = ["libs/*", "services/*"] }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
