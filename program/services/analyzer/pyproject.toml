[project]
name = "analyzer"
version = "0.1.0"
description = "Research report analyzer service using LLM Gateway"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "llm-gateway",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
