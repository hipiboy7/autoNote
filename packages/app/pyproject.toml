[project]
name = "autonote-app"
version = "0.1.0"
description = "autoNote orchestration layer (batch, repair, notify, watchdog)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "agy-gateway",
    "google-docs-client",
    "telegram-client",
    "analyzer",
    "collector",
    "merger",
    "reviewer",
    "writer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonote"]

[tool.pytest.ini_options]
pythonpath = ["src"]
